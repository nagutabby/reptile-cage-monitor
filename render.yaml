services:
  - type: web
    name: reptile-monitor-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --limit-concurrency 20
    envVars:
      - key: API_KEY
        sync: false
      - key: IOT_INGEST_KEY
        sync: false
      - key: COGNITO_METADATA_URL
        value: https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_4Y1gDBGfp/.well-known/openid-configuration
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_D1_DATABASE_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_TO_ID
        sync: false
